<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Facebook Reel</title>
  <desc id="desc">Miniatura genérica para videos enlazados desde Facebook Reels.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0866ff"/>
      <stop offset="0.52" stop-color="#6b39f5"/>
      <stop offset="1" stop-color="#f0287a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" rx="42" fill="url(#background)"/>
  <rect width="1280" height="720" rx="42" fill="url(#glow)"/>
  <g fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3">
    <circle cx="1020" cy="130" r="210"/>
    <circle cx="1100" cy="650" r="280"/>
    <circle cx="150" cy="650" r="250"/>
  </g>
  <circle cx="640" cy="285" r="116" fill="#fff" fill-opacity="0.96"/>
  <path d="M615 222 615 348 712 285Z" fill="#0866ff"/>
  <text x="640" y="490" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" text-anchor="middle">Facebook Reel</text>
  <text x="640" y="555" fill="#fff" fill-opacity="0.86" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle">Abrir el video original</text>
</svg>
