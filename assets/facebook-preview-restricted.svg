<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa restringida por Facebook</title>
  <desc id="desc">La miniatura solo está disponible al abrir el Reel original.</desc>
