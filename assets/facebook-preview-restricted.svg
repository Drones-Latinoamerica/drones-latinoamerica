    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111815"/>
      <stop offset="1" stop-color="#253126"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
